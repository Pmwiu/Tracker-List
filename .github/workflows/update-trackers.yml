name: Auto Update Trackers

on:
  schedule:
    # 每天 UTC 00:00 运行（北京时间 08:00），约每 24 小时一次
    - cron: "0 0 * * *"
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-trackers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tracker update script
        run: python scripts/update_trackers.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code --quiet
          if [ $? -eq 1 ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add trackers/ docs/
          git commit -m "chore: auto-update trackers list $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Health check
        run: python scripts/health_check.py --rounds 3
        continue-on-error: true
