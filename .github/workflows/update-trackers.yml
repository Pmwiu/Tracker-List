name: Auto Update Trackers

on:
  schedule:
    # 每 6 小时运行一次（UTC 02:23/08:23/14:23/20:23，避开整点拥堵，增强实时性）
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-trackers.yml'
      - 'scripts/**'

# 防止并发运行：同一时间只允许一个实例，新运行取消旧的进行中运行
concurrency:
  group: tracker-update
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  update-trackers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 当前无外部依赖，预留位置
          echo "No external dependencies required"

      # 诊断：环境、锁、各源连通性，结果写入 diag.log
      - name: Diagnose environment and source connectivity
        continue-on-error: true
        run: |
          : > diag.log
          {
            echo "=== Diagnostics $(date -u) ==="
            echo "Python: $(python --version 2>&1)"
            echo "PWD: $(pwd)"
            echo "--- Test file lock (fcntl) ---"
            python -c "import fcntl; f=open('.update.lock','w'); fcntl.flock(f, fcntl.LOCK_EX|fcntl.LOCK_NB); print('lock OK')"
            echo "--- Test source connectivity ---"
            for u in "https://cf.trackerslist.com/best.txt" "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best_ip.txt" "https://tracker.adysec.com/trackers_best.txt" "https://tracker.adysec.com/trackers_best_http.txt" "https://tracker.adysec.com/trackers_best_https.txt" "https://tracker.adysec.com/trackers_best_udp.txt" "https://tracker.adysec.com/trackers_best_wss.txt" "https://raw.githubusercontent.com/DeSireFire/animeTrackerList/refs/heads/master/ATline_best.txt" "https://raw.githubusercontent.com/DeSireFire/animeTrackerList/refs/heads/master/ATline_best_ip.txt"; do
              echo ">>> $u"
              curl -sS -o /dev/null -w "  HTTP %{http_code}, total %{time_total}s\n" --connect-timeout 8 --max-time 20 "$u" || echo "  curl exit: $?"
            done
          } 2>&1 | tee diag.log

      # 心跳：每次运行更新 .github/last_run.txt（成功/失败都会由 persist 步骤提交）
      - name: Write heartbeat
        run: |
          mkdir -p .github
          date -u +'%Y-%m-%d %H:%M:%S UTC' > .github/last_run.txt
          cat .github/last_run.txt

      # 步骤 1：下载源列表、合并去重
      - name: Download, merge and deduplicate trackers
        id: download
        run: |
          set +e
          python scripts/update_trackers.py 2>&1 | tee -a diag.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          if [ "$code" -ne 0 ]; then
            echo "::error::update_trackers.py failed with exit code $code"
            exit $code
          fi

      # 步骤 2：协议级活性测试 + 综合评分排序
      # 精选源优先，最多测试 500 个候选，避免对数千 tracker 全量测试而超时
      - name: Test tracker liveness and score ranking
        id: test
        run: |
          set +e
          python scripts/test_trackers.py --timeout 10 --workers 30 --max-candidates 500 2>&1 | tee -a diag.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          if [ "$code" -ne 0 ]; then
            echo "::error::test_trackers.py failed with exit code $code"
            exit $code
          fi

      # 步骤 3：本地健康检查（跳过网络）
      - name: Local health check
        run: python scripts/health_check.py --rounds 1 --skip-net 2>&1 | tee -a diag.log

      # 步骤 4：检测变更
      - name: Check for changes
        id: git-check
        run: |
          if git diff --exit-code --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
          fi

      # 步骤 5：提交推送（带 rebase 重试，处理并发更新）
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add trackers/ docs/
          git commit -m "chore: auto-update trackers $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 远程可能在测试期间有新提交，rebase 后重试推送
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            echo "::warning::Push attempt $i failed, retrying after rebase..."
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Failed to push after 3 attempts"
            exit 1
          fi

      # 步骤 6：推送后网络健康检查（3轮）
      - name: Post-push health check
        if: steps.git-check.outputs.changed == 'true'
        run: |
          sleep 5
          python scripts/health_check.py --rounds 3 --interval 5 2>&1 | tee -a diag.log
        continue-on-error: true

      # 总是运行：把诊断日志持久化到仓库文件（可靠，便于无法下载日志时排查）
      - name: Persist diagnostics to repo
        if: always()
        continue-on-error: true
        run: |
          echo "=== End of diagnostics ($(date -u)) ===" >> diag.log
          cp diag.log docs/ci-diag.md
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ci-diag.md .github/last_run.txt
          git add reports/ 2>/dev/null || true
          git commit -m "ci: persist diagnostics and heartbeat" || true
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}" && break
            echo "retry push $i..."
            sleep 3
          done

      # 失败告警：自动创建 Issue
      - name: Create failure issue
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            try { summary = fs.readFileSync('reports/run_summary.json', 'utf8'); } catch (e) {}
            let logTail = '';
            try {
              const log = fs.readFileSync('diag.log', 'utf8');
              logTail = log.split('\n').slice(-40).join('\n');
            } catch (e) {}
            const title = `[自动告警] Tracker 更新失败 - ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              `运行链接: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              '',
              '## run_summary.json',
              '```json',
              summary || '(无)',
              '```',
              '',
              '## 日志尾部',
              '```',
              logTail || '(无)',
              '```',
            ].join('\n');
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automated-alert'],
              });
            } catch (err) {
              console.log('Create issue failed:', err.message);
            }

      # 成功后关闭历史告警 Issue
      - name: Close stale alert issues
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated-alert',
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

      # 双托管：同步部署到 Cloudflare Pages（需仓库 secrets：CF_API_TOKEN、CF_ACCOUNT_ID）
      - name: Deploy to Cloudflare Pages
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy docs --project-name tracker-list
