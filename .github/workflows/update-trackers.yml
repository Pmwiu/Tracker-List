name: Auto Update Trackers

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: tracker-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-trackers:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          echo "No external dependencies required"

      - name: Download, merge and deduplicate trackers
        id: download
        run: |
          python scripts/update_trackers.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Test tracker liveness and score ranking
        id: test
        run: |
          python scripts/test_trackers.py --timeout 10 --workers 30
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Local health check
        run: python scripts/health_check.py --rounds 1 --skip-net

      - name: Check for changes
        id: git-check
        run: |
          if git diff --exit-code --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add trackers/ docs/
          git commit -m "chore: auto-update trackers $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Post-push health check
        if: steps.git-check.outputs.changed == 'true'
        run: |
          sleep 5
          python scripts/health_check.py --rounds 3 --interval 5
        continue-on-error: true
