name: Auto Update Trackers

on:
  schedule:
    # 每天 UTC 00:00 运行（北京时间 08:00）
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-trackers.yml'
      - 'scripts/**'

# 防止并发运行：同一时间只允许一个实例，新的排队
concurrency:
  group: tracker-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-trackers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 当前无外部依赖，预留位置
          echo "No external dependencies required"

      # 步骤 1：下载源列表、合并去重
      - name: Download, merge and deduplicate trackers
        id: download
        run: |
          set +e
          python scripts/update_trackers.py
          code=$?
          set -e
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          if [ "$code" -ne 0 ]; then
            echo "::error::update_trackers.py failed with exit code $code"
            exit $code
          fi

      # 步骤 2：协议级活性测试 + 综合评分排序
      # 精选源优先，最多测试 500 个候选，避免对数千 tracker 全量测试而超时
      - name: Test tracker liveness and score ranking
        id: test
        run: |
          set +e
          python scripts/test_trackers.py --timeout 10 --workers 30 --max-candidates 500
          code=$?
          set -e
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          if [ "$code" -ne 0 ]; then
            echo "::error::test_trackers.py failed with exit code $code"
            exit $code
          fi

      # 步骤 3：本地健康检查（跳过网络，因为后面单独做）
      - name: Local health check
        run: python scripts/health_check.py --rounds 1 --skip-net

      # 步骤 4：检测变更
      - name: Check for changes
        id: git-check
        run: |
          if git diff --exit-code --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected."
          fi

      # 步骤 5：提交推送（带 rebase 重试，处理并发更新）
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add trackers/ docs/
          git commit -m "chore: auto-update trackers $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 远程可能在测试期间有新提交，rebase 后重试推送
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            echo "::warning::Push attempt $i failed, retrying after rebase..."
            sleep 5
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Failed to push after 3 attempts"
            exit 1
          fi

      # 步骤 6：推送后网络健康检查（3轮）
      - name: Post-push health check
        if: steps.git-check.outputs.changed == 'true'
        run: |
          sleep 5  # 等待 Pages 部署
          python scripts/health_check.py --rounds 3 --interval 5
        continue-on-error: true
